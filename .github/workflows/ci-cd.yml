name: ✦ LightScript Workshop

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    name: ▸ Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: ← Checkout
        uses: actions/checkout@v4

      - name: ⚙ Setup pnpm
        uses: pnpm/action-setup@v4

      - name: ⚙ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: ↓ Install dependencies
        run: pnpm install --frozen-lockfile

      - name: ✓ Lint
        run: pnpm lint

      - name: ✓ Typecheck
        run: pnpm typecheck

      - name: ✓ Test
        run: pnpm test

      - name: ⬡ Build packages
        run: pnpm build:packages

      - name: ⬡ Build effects
        run: pnpm build:effects

      - name: ↑ Upload effects
        uses: actions/upload-artifact@v4
        with:
          name: lightscript-effects
          path: dist/
          retention-days: 7

  pages:
    name: ▸ Build Pages
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    steps:
      - name: ← Checkout
        uses: actions/checkout@v4

      - name: ⚙ Setup pnpm
        uses: pnpm/action-setup@v4

      - name: ⚙ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: ↓ Install dependencies
        run: pnpm install --frozen-lockfile

      - name: ⬡ Build packages
        run: pnpm build:packages

      - name: ⬡ Build docs
        run: pnpm docs:build

      - name: ⬡ Build playground
        run: pnpm playground:build

      - name: ◇ Combine builds
        run: node scripts/combine-pages.js

      - name: ↑ Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist-pages

  deploy:
    name: → Deploy Pages
    runs-on: ubuntu-latest
    needs: pages
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: ⟶ Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  release:
    name: ★ Release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: ↓ Download effects
        uses: actions/download-artifact@v4
        with:
          name: lightscript-effects
          path: dist/

      - name: ◇ Create archive
        run: |
          cd dist
          zip -r ../lightscript-effects.zip .

      - name: ★ Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: lightscript-effects.zip
          name: Release ${{ github.ref_name }}
          generate_release_notes: true
